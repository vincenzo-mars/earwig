[package]
name = "earwig"
version = "0.1.0"
description = "earwig audio recorder"
authors = ["Vincenzo Mars"]
edition = "2021"

[lib]
name = "earwig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
chrono = "0.4"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
futures-util = "0.3"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "pcm", "wav"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "7"

