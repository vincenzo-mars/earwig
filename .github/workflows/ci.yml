name: CI

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck (Svelte)
        run: npm run typecheck

  rust-check:
    name: Rust Check
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select pinned Xcode
        run: |
          XCODE=/Applications/Xcode_26.3.0.app
          if [ ! -d "$XCODE" ]; then
            echo "Xcode 26.3.0 non presente sul runner. Disponibili:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Stub bundled server binaries
        run: mkdir -p src-tauri/binaries && touch src-tauri/binaries/whisper-server src-tauri/binaries/llama-server

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
